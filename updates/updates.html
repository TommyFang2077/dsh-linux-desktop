<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>软件更新</title>
  <link rel="stylesheet" href="updates.css">
</head>
<body>
  <main>
    <h1>软件更新</h1>
    <section>
      <p id="version">正在读取版本…</p>
      <p id="latest"></p>
      <div class="actions"><button data-action="check">检查更新</button><button data-action="install" disabled>确认安装并重启</button></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert"></p>
    <small>更新会校验签名，不会删除会话或 API 配置。</small>
  </main>
  <script src="updates.js"></script>
</body>
</html>
