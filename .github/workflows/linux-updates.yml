name: dsh-linux-desktop unsigned build and tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      unreviewed:
        default: false
        type: boolean
      baseline_sha:
        default: ''
        type: string
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact: linux-updates-${{ inputs.source_sha || github.sha }}
    env:
      ALLOW_UNREVIEWED: ${{ inputs.unreviewed || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release configuration
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createPublicKey } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { releaseFeedNames } from './scripts/build-bridge.mjs'
          const config = JSON.parse(readFileSync('updates.json', 'utf8'))
          const metadata = JSON.parse(readFileSync('desktop.json', 'utf8'))
          const { version, linuxRevision, dataEpoch, followOfficial } = metadata
          const upstream = JSON.parse(readFileSync('upstream.json', 'utf8'))
          const policy = JSON.parse(readFileSync('scripts/upstream-policy.json', 'utf8'))
          assert.equal(upstream.repository, 'https://github.com/deepseek-ai/deepseek-harness.git')
          assert.equal(upstream.version, version)
          assert.match(upstream.commit, /^[0-9a-f]{40}$/)
          const official = policy.sources[version]
          const transition = policy.transitions.some(row => row.status === 'compatible' && row.evidence &&
            JSON.stringify(row.upstream) === JSON.stringify(upstream) &&
            JSON.stringify(row.desktop) === JSON.stringify(JSON.parse(readFileSync('desktop.json', 'utf8'))))
          const automatic = followOfficial === true && policy.automaticRelease?.enabled === true
          if (process.env.ALLOW_UNREVIEWED !== 'true' && !transition && !automatic) {
            assert.deepEqual({ commit: upstream.commit, pnpm: upstream.pnpm }, official)
          }
          if (automatic && !official) assert.equal(dataEpoch, `dsh-${version}`, 'automatic releases keep their actual data identity')
          const feeds = releaseFeedNames(metadata)
          for (const channel of ['kernel', 'desktop']) {
            assert.equal(config[channel].url, `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/update-feed/${feeds[channel]}`)
            assert.equal(createPublicKey(config[channel].publicKey).asymmetricKeyType, 'ed25519')
          }
          const migrationFeeds = policy.desktopUpgradeFeeds ?? {}
          const migrationUrl = name => `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/update-feed/${name}`
          if (automatic) assert.equal(config.desktopUpgrade.url, migrationUrl(feeds.desktop))
          else if (migrationFeeds[dataEpoch]) assert.equal(config.desktopUpgrade.url, migrationUrl(migrationFeeds[dataEpoch]))
          else {
            assert.equal(process.env.ALLOW_UNREVIEWED, 'true', 'migration feed for this epoch is not explicitly approved')
            assert.ok(Object.values(migrationFeeds).map(migrationUrl).includes(config.desktopUpgrade.url), 'unreviewed candidate must preserve an approved migration feed')
          }
          assert.equal(config.desktopUpgrade.publicKey, config.desktop.publicKey)
          assert.ok(Number.isSafeInteger(linuxRevision) && linuxRevision > 0)
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `workbench-v${version}-r${linuxRevision}`)
          JS
      - name: Verify official Release tag and immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: verify
        run: python3 scripts/upstream-release.py
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 rpm xvfb libgtk-3-0t64 libnss3 libxss1 libxtst6 libgbm1 libasound2t64 libatspi2.0-0t64 xdg-utils
      - name: Fetch the frozen alpha.1 baseline
        run: git fetch --depth=1 origin tag workbench-v0.2.1-alpha.1-r7
      - name: Permit user namespaces for migration tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare, test and package official Linux sources
        run: |
          make package
          if [[ "$(node -p 'JSON.parse(require("fs").readFileSync("desktop.json", "utf8")).dataEpoch')" == dsh-0.2.1-alpha.1 ]]; then
            node --test tests/bridge-update.test.mjs tests/workflow.test.mjs tests/manifest.test.mjs
          else
            make test
          fi
          node --test tests/archive-worker.test.mjs
      - name: Prepare unsigned release payloads with a disposable key
        run: |
          set -euo pipefail
          key=$(mktemp "$RUNNER_TEMP/workbench-disposable.XXXXXX")
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          openssl genpkey -algorithm ED25519 -out "$key"
          version=$(node -p 'JSON.parse(require("fs").readFileSync("desktop.json", "utf8")).version')
          revision=$(node -p 'JSON.parse(require("fs").readFileSync("desktop.json", "utf8")).linuxRevision')
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/workbench-v$version-r$revision/"
          node build/release-updates.mjs kernel \
            --archive "dist/dsh-workbench-$version-r$revision-linux-x64.tar.gz" \
            --metadata desktop.json --output dist/kernel-release --key "$key" --base-url "$base"
          node build/release-updates.mjs desktop \
            --archive "dist/dsh-workbench-$version-r$revision-linux-x64.tar.gz" \
            --deb "dist/dsh-workbench-$version-r$revision-linux-x64.deb" \
            --rpm "dist/dsh-workbench-$version-r$revision-linux-x64.rpm" \
            --metadata desktop.json --output dist/desktop-release --key "$key" --base-url "$base"
      - name: Verify the previous shell with the real official candidate kernel
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ inputs.baseline_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --depth=1 origin "$BASE_SHA"
          else
            git fetch --deepen=1 origin "$(git rev-parse HEAD)"
            export BASE_SHA="$(git rev-parse HEAD^)"
          fi
          xvfb-run -a node scripts/follow-kernel-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-updates-${{ inputs.source_sha || github.sha }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/dsh-workbench-*-linux-x64.tar.gz
            dist/dsh-workbench-*-linux-x64.deb
            dist/dsh-workbench-*-linux-x64.rpm
            dist/SHA256SUMS
            dist/build-info.json
            dist/kernel-adaptation.json
            dist/kernel-release/
            dist/desktop-release/
