name: Publish explicit Linux release tag
on:
  push:
    tags: ['workbench-v*']
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-updates.yml
    with:
      source_sha: ${{ github.sha }}
  publish:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/publish-updates.yml
    with:
      source_sha: ${{ github.sha }}
      artifact: ${{ needs.build.outputs.artifact }}
      release_tag: ${{ github.ref_name }}
    secrets:
      signing_key: ${{ secrets.DSH_WORKBENCH_UPDATE_SIGNING_KEY }}
