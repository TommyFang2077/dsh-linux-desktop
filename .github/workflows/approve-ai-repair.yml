name: Human approval of exact AI repair candidate
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact 40-character candidate SHA reviewed by a human
        required: true
        type: string
      repair_run_id:
        description: Successful upstream automation run containing immutable provenance
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: upstream-release-automation
  cancel-in-progress: false
jobs:
  approve:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify trusted successful run and immutable artifact digest
        env:
          MODE: check-run
        run: python3 scripts/upstream-repair.py
      - name: Record exact-head review snapshot without merging or changing branch protection
        env:
          MODE: approve
        run: python3 scripts/upstream-repair.py
